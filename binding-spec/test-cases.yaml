schema_version: 1

# Conservative, string-expectation-only behavioral cases shared across every
# wrapper. Do not add ownership or identity assertions here (see the roadmap's
# "Phase 5" section); those remain native, per-wrapper tests because their
# runtime semantics differ across ownership models.
cases:
  - id: add_integers
    arrange:
      x: {integer: 2}
      y: {integer: 3}
    call: {function: add, arguments: [x, y]}
    expect: {string: "5"}
  - id: sub_integers
    arrange:
      x: {integer: 3}
      y: {integer: 2}
    call: {function: sub, arguments: [x, y]}
    expect: {string: "1"}
  - id: mul_integers
    arrange:
      x: {integer: 2}
      y: {integer: 3}
    call: {function: mul, arguments: [x, y]}
    expect: {string: "6"}
  - id: div_integers
    arrange:
      x: {integer: 3}
      y: {integer: 2}
    call: {function: div, arguments: [x, y]}
    expect: {string: "3/2"}
  - id: pow_integers
    arrange:
      x: {integer: 2}
      y: {integer: 3}
    call: {function: pow, arguments: [x, y]}
    expect: {string: "8"}
  - id: neg_integer
    arrange:
      x: {integer: 2}
    call: {function: neg, arguments: [x]}
    expect: {string: "-2"}
  - id: sin_symbol
    arrange:
      x: {symbol: x}
    call: {function: sin, arguments: [x]}
    expect: {string: "sin(x)"}

  # Mixed symbol/integer arithmetic.  These replace the per-wrapper hand-written
  # "phase0" smoke assertions, which were the same expectations copied five
  # times; each wrapper's remaining smoke test only bootstraps what the shared
  # schema cannot express (module load, factories, equality, ownership).
  - id: add_symbol_integer
    arrange:
      x: {symbol: phase0_x}
      y: {integer: 2}
    call: {function: add, arguments: [x, y]}
    expect: {string: "2 + phase0_x"}
  - id: sub_symbol_integer
    arrange:
      x: {symbol: phase0_x}
      y: {integer: 2}
    call: {function: sub, arguments: [x, y]}
    expect: {string: "-2 + phase0_x"}
  - id: mul_symbol_integer
    arrange:
      x: {symbol: phase0_x}
      y: {integer: 2}
    call: {function: mul, arguments: [x, y]}
    expect: {string: "2*phase0_x"}
  - id: div_symbol_integer
    arrange:
      x: {symbol: phase0_x}
      y: {integer: 2}
    call: {function: div, arguments: [x, y]}
    expect: {string: "(1/2)*phase0_x"}
  - id: pow_symbol_integer
    arrange:
      x: {symbol: phase0_x}
      y: {integer: 2}
    call: {function: pow, arguments: [x, y]}
    expect: {string: "phase0_x**2"}
  - id: neg_symbol
    arrange:
      x: {symbol: phase0_x}
    call: {function: neg, arguments: [x]}
    expect: {string: "-phase0_x"}

  # Singleton constants; one case per shared spec entry so every wrapper proves
  # its generated accessor is registered and returns the expected object.
  - id: zero_constant
    arrange: {}
    call: {function: zero, arguments: []}
    expect: {string: "0"}
  - id: one_constant
    arrange: {}
    call: {function: one, arguments: []}
    expect: {string: "1"}
  - id: pi_constant
    arrange: {}
    call: {function: pi, arguments: []}
    expect: {string: "pi"}
  - id: minus_one_constant
    arrange: {}
    call: {function: minus_one, arguments: []}
    expect: {string: "-1"}
  - id: two_constant
    arrange: {}
    call: {function: two, arguments: []}
    expect: {string: "2"}
  - id: i_constant
    arrange: {}
    call: {function: i, arguments: []}
    expect: {string: "I"}
  - id: e_constant
    arrange: {}
    call: {function: e, arguments: []}
    expect: {string: "E"}
  - id: euler_gamma_constant
    arrange: {}
    call: {function: euler_gamma, arguments: []}
    expect: {string: "EulerGamma"}
  - id: catalan_constant
    arrange: {}
    call: {function: catalan, arguments: []}
    expect: {string: "Catalan"}
  - id: golden_ratio_constant
    arrange: {}
    call: {function: golden_ratio, arguments: []}
    expect: {string: "GoldenRatio"}
  - id: inf_constant
    arrange: {}
    call: {function: inf, arguments: []}
    expect: {string: "oo"}
  - id: neg_inf_constant
    arrange: {}
    call: {function: neg_inf, arguments: []}
    expect: {string: "-oo"}
  - id: complex_inf_constant
    arrange: {}
    call: {function: complex_inf, arguments: []}
    expect: {string: "zoo"}
  - id: nan_constant
    arrange: {}
    call: {function: nan, arguments: []}
    expect: {string: "nan"}

  # Elementary and special functions.  A representative sample rather than one
  # case per entry: the ``unary_basic``/``binary_basic`` adapters are rendered
  # from a single code path per language, so these prove that path end to end
  # for a symbolic result, an exactly evaluated result, and a binary call.
  - id: sqrt_integer
    arrange:
      x: {integer: 2}
    call: {function: sqrt, arguments: [x]}
    expect: {string: "sqrt(2)"}
  - id: log_symbol
    arrange:
      x: {symbol: x}
    call: {function: log, arguments: [x]}
    expect: {string: "log(x)"}
  - id: abs_negative_integer
    arrange:
      x: {integer: -3}
    call: {function: abs, arguments: [x]}
    expect: {string: "3"}
  - id: cosh_symbol
    arrange:
      x: {symbol: x}
    call: {function: cosh, arguments: [x]}
    expect: {string: "cosh(x)"}
  - id: asin_symbol
    arrange:
      x: {symbol: x}
    call: {function: asin, arguments: [x]}
    expect: {string: "asin(x)"}
  - id: gamma_integer
    arrange:
      x: {integer: 5}
    call: {function: gamma, arguments: [x]}
    expect: {string: "24"}
  - id: zeta_integer
    arrange:
      s: {integer: 2}
    call: {function: zeta, arguments: [s]}
    expect: {string: "(1/6)*pi**2"}
  - id: atan2_integers
    arrange:
      x: {integer: 1}
      y: {integer: 1}
    call: {function: atan2, arguments: [x, y]}
    expect: {string: "(1/4)*pi"}

  # Relational constructors.  One case per entry, covering both results the
  # family can produce: an unevaluated symbolic relation and a decided
  # ``True``.  ``Ge``/``Gt`` canonicalize to their mirrored form, which is why
  # ``ge(x, 2)`` prints "2 <= x".  Every wrapper returns the ordinary
  # expression handle, so the shared string expectation applies unchanged.
  - id: eq_equal_integers
    arrange:
      x: {integer: 2}
      y: {integer: 2}
    call: {function: eq, arguments: [x, y]}
    expect: {string: "True"}
  - id: ne_distinct_integers
    arrange:
      x: {integer: 2}
      y: {integer: 3}
    call: {function: ne, arguments: [x, y]}
    expect: {string: "True"}
  - id: lt_symbol_integer
    arrange:
      x: {symbol: x}
      y: {integer: 2}
    call: {function: lt, arguments: [x, y]}
    expect: {string: "x < 2"}
  - id: le_symbols
    arrange:
      x: {symbol: x}
      y: {symbol: y}
    call: {function: le, arguments: [x, y]}
    expect: {string: "x <= y"}
  - id: ge_symbol_integer
    arrange:
      x: {symbol: x}
      y: {integer: 2}
    call: {function: ge, arguments: [x, y]}
    expect: {string: "2 <= x"}
  - id: gt_integers
    arrange:
      x: {integer: 3}
      y: {integer: 2}
    call: {function: gt, arguments: [x, y]}
    expect: {string: "True"}

  # Number-theory entries whose C++ arguments are ``Integer`` rather than
  # ``Basic``.  These exercise the generated downcast in the four type-erased
  # wrappers on the happy path; rejecting a non-Integer argument is runtime
  # behavior and stays a hand-written negative test in each native suite.
  - id: gcd_integers
    arrange:
      a: {integer: 12}
      b: {integer: 18}
    call: {function: gcd, arguments: [a, b]}
    expect: {string: "6"}
  - id: lcm_integers
    arrange:
      a: {integer: 4}
      b: {integer: 6}
    call: {function: lcm, arguments: [a, b]}
    expect: {string: "12"}
  - id: nextprime_integer
    arrange:
      a: {integer: 7}
    call: {function: nextprime, arguments: [a]}
    expect: {string: "11"}
  - id: totient_integer
    arrange:
      a: {integer: 12}
    call: {function: totient, arguments: [a]}
    expect: {string: "4"}
  - id: carmichael_integer
    arrange:
      a: {integer: 12}
    call: {function: carmichael, arguments: [a]}
    expect: {string: "2"}
