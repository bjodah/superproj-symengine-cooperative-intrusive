schema_version: 1

types:
  basic:
    cpp: SymEngine::RCP<const SymEngine::Basic>
    category: expression
  integer:
    cpp: SymEngine::RCP<const SymEngine::Integer>
    category: expression
    extends: basic
  boolean:
    cpp: SymEngine::RCP<const SymEngine::Boolean>
    category: expression
    extends: basic
  number:
    cpp: SymEngine::RCP<const SymEngine::Number>
    category: expression
    extends: basic
  double:
    cpp: double
    category: value
  unsigned:
    cpp: unsigned
    category: value

functions:
  - id: add
    cpp: {name: SymEngine::add, header: symengine/add.h}
    arguments: [{name: a, type: basic}, {name: b, type: basic}]
    returns: basic
    behavior: binary_basic
    expose: [python, perl, php, swift, java]
    implementation: generated
  - id: div
    cpp: {name: SymEngine::div, header: symengine/mul.h}
    arguments: [{name: a, type: basic}, {name: b, type: basic}]
    returns: basic
    behavior: binary_basic
    expose: [python, perl, php, swift, java]
    names: {swift: divide}
    implementation: generated
  - id: mul
    cpp: {name: SymEngine::mul, header: symengine/mul.h}
    arguments: [{name: a, type: basic}, {name: b, type: basic}]
    returns: basic
    behavior: binary_basic
    expose: [python, perl, php, swift, java]
    names: {swift: multiply}
    implementation: generated
  - id: neg
    cpp: {name: SymEngine::neg, header: symengine/mul.h}
    arguments: [{name: a, type: basic}]
    returns: basic
    behavior: unary_basic
    expose: [python, perl, php, swift, java]
    names: {swift: negate}
    implementation: generated
  - id: one
    cpp: {expression: SymEngine::one, header: symengine/constants.h}
    arguments: []
    returns: basic
    behavior: singleton
    expose: [python, perl, php, swift, java]
    implementation: generated
  - id: pi
    cpp: {expression: SymEngine::pi, header: symengine/constants.h}
    arguments: []
    returns: basic
    behavior: singleton
    expose: [python, perl, php, swift, java]
    implementation: generated
  - id: pow
    cpp: {name: SymEngine::pow, header: symengine/pow.h}
    arguments: [{name: a, type: basic}, {name: b, type: basic}]
    returns: basic
    behavior: binary_basic
    expose: [python, perl, php, swift, java]
    names: {swift: power}
    implementation: generated
  - &unary
    id: sin
    cpp: {name: SymEngine::sin, header: symengine/functions.h}
    arguments: [{name: a, type: basic}]
    returns: basic
    behavior: unary_basic
    expose: [python, perl, php, swift, java]
    implementation: generated
  - id: sub
    cpp: {name: SymEngine::sub, header: symengine/add.h}
    arguments: [{name: a, type: basic}, {name: b, type: basic}]
    returns: basic
    behavior: binary_basic
    expose: [python, perl, php, swift, java]
    names: {perl: sub, swift: subtract}
    implementation: generated
  - id: zero
    cpp: {expression: SymEngine::zero, header: symengine/constants.h}
    arguments: []
    returns: basic
    behavior: singleton
    expose: [python, perl, php, swift, java]
    implementation: generated

  # Singleton constants beyond zero/one/pi.  Every wrapper renders these from
  # the same entries; the Python overrides preserve the names nbsymengine has
  # always exposed (``I``/``oo``/``zoo``/``nan_const``) and the PHP defaults
  # reproduce the extension's existing ``symengine_*`` spellings.
  #
  # ``catalan``, ``golden_ratio``, ``minus_one``, ``neg_inf`` and ``two`` are
  # deliberately not exposed to python: nbsymengine never bound them, and
  # nbsymengine_compat re-exports every new ``_core`` name into the frozen
  # legacy ``symengine`` surface.  Adding them there is a downstream API
  # decision, not a side effect of consolidating the shared spec.
  - &singleton
    id: e
    cpp: {expression: SymEngine::E, header: symengine/constants.h}
    arguments: []
    returns: basic
    behavior: singleton
    expose: [python, perl, php, swift, java]
    implementation: generated
  - {<<: *singleton, id: euler_gamma, cpp: {expression: SymEngine::EulerGamma, header: symengine/constants.h}}
  - {<<: *singleton, id: i, cpp: {expression: SymEngine::I, header: symengine/constants.h}, names: {python: I}}
  - {<<: *singleton, id: inf, cpp: {expression: SymEngine::Inf, header: symengine/constants.h}, returns: number, names: {python: oo}}
  - {<<: *singleton, id: complex_inf, cpp: {expression: SymEngine::ComplexInf, header: symengine/constants.h}, returns: number, names: {python: zoo}}
  - {<<: *singleton, id: nan, cpp: {expression: SymEngine::Nan, header: symengine/constants.h}, returns: number, names: {python: nan_const}}
  - {<<: *singleton, id: catalan, cpp: {expression: SymEngine::Catalan, header: symengine/constants.h}, expose: [perl, php, swift, java]}
  - {<<: *singleton, id: golden_ratio, cpp: {expression: SymEngine::GoldenRatio, header: symengine/constants.h}, expose: [perl, php, swift, java]}
  - {<<: *singleton, id: minus_one, cpp: {expression: SymEngine::minus_one, header: symengine/constants.h}, expose: [perl, php, swift, java]}
  - {<<: *singleton, id: neg_inf, cpp: {expression: SymEngine::NegInf, header: symengine/constants.h}, returns: number, expose: [perl, php, swift, java]}
  - {<<: *singleton, id: two, cpp: {expression: SymEngine::two, header: symengine/constants.h}, expose: [perl, php, swift, java]}

  # Merge templates keep the shared spec declarative without re-stating a
  # C++ API for each mechanical adapter-family entry.  Both merge anchors
  # (``unary`` above, ``binary`` here) expose every language: the
  # ``unary_basic``/``binary_basic`` adapters are fully generated in all five
  # renderers, so an entry's default is "available everywhere" and any
  # narrower ``expose`` needs a reason spelled out next to it.
  - &binary
    id: atan2
    cpp: {name: SymEngine::atan2, header: symengine/functions.h}
    arguments: [{name: a, type: basic}, {name: b, type: basic}]
    returns: basic
    behavior: binary_basic
    expose: [python, perl, php, swift, java]
    implementation: generated
  - {<<: *unary, id: cos, cpp: {name: SymEngine::cos, header: symengine/functions.h}}
  - {<<: *unary, id: tan, cpp: {name: SymEngine::tan, header: symengine/functions.h}}
  - {<<: *unary, id: cot, cpp: {name: SymEngine::cot, header: symengine/functions.h}}
  - {<<: *unary, id: csc, cpp: {name: SymEngine::csc, header: symengine/functions.h}}
  - {<<: *unary, id: sec, cpp: {name: SymEngine::sec, header: symengine/functions.h}}
  - {<<: *unary, id: asin, cpp: {name: SymEngine::asin, header: symengine/functions.h}}
  - {<<: *unary, id: acos, cpp: {name: SymEngine::acos, header: symengine/functions.h}}
  - {<<: *unary, id: atan, cpp: {name: SymEngine::atan, header: symengine/functions.h}}
  - {<<: *unary, id: acot, cpp: {name: SymEngine::acot, header: symengine/functions.h}}
  - {<<: *unary, id: asec, cpp: {name: SymEngine::asec, header: symengine/functions.h}}
  - {<<: *unary, id: acsc, cpp: {name: SymEngine::acsc, header: symengine/functions.h}}
  - {<<: *unary, id: sinh, cpp: {name: SymEngine::sinh, header: symengine/functions.h}}
  - {<<: *unary, id: cosh, cpp: {name: SymEngine::cosh, header: symengine/functions.h}}
  - {<<: *unary, id: tanh, cpp: {name: SymEngine::tanh, header: symengine/functions.h}}
  - {<<: *unary, id: coth, cpp: {name: SymEngine::coth, header: symengine/functions.h}}
  - {<<: *unary, id: sech, cpp: {name: SymEngine::sech, header: symengine/functions.h}}
  - {<<: *unary, id: csch, cpp: {name: SymEngine::csch, header: symengine/functions.h}}
  - {<<: *unary, id: asinh, cpp: {name: SymEngine::asinh, header: symengine/functions.h}}
  - {<<: *unary, id: acosh, cpp: {name: SymEngine::acosh, header: symengine/functions.h}}
  - {<<: *unary, id: atanh, cpp: {name: SymEngine::atanh, header: symengine/functions.h}}
  - {<<: *unary, id: acoth, cpp: {name: SymEngine::acoth, header: symengine/functions.h}}
  - {<<: *unary, id: asech, cpp: {name: SymEngine::asech, header: symengine/functions.h}}
  - {<<: *unary, id: acsch, cpp: {name: SymEngine::acsch, header: symengine/functions.h}}
  - {<<: *unary, id: log, cpp: {name: SymEngine::log, header: symengine/functions.h}}
  - {<<: *unary, id: sqrt, cpp: {name: SymEngine::sqrt, header: symengine/functions.h}}
  - {<<: *unary, id: abs, cpp: {name: SymEngine::abs, header: symengine/functions.h}}
  - {<<: *unary, id: sign, cpp: {name: SymEngine::sign, header: symengine/functions.h}}
  - {<<: *unary, id: floor, cpp: {name: SymEngine::floor, header: symengine/functions.h}}
  - {<<: *unary, id: ceiling, cpp: {name: SymEngine::ceiling, header: symengine/functions.h}}
  - {<<: *unary, id: gamma, cpp: {name: SymEngine::gamma, header: symengine/functions.h}}
  - {<<: *unary, id: erf, cpp: {name: SymEngine::erf, header: symengine/functions.h}}
  - {<<: *unary, id: erfc, cpp: {name: SymEngine::erfc, header: symengine/functions.h}}
  - {<<: *unary, id: lambertw, cpp: {name: SymEngine::lambertw, header: symengine/functions.h}}
  - {<<: *unary, id: zeta, cpp: {name: SymEngine::zeta, header: symengine/functions.h}, arguments: [{name: s, type: basic}]}
  - {<<: *unary, id: dirichlet_eta, cpp: {name: SymEngine::dirichlet_eta, header: symengine/functions.h}, arguments: [{name: s, type: basic}]}
  - {<<: *binary, id: beta, cpp: {name: SymEngine::beta, header: symengine/functions.h}, arguments: [{name: x, type: basic}, {name: y, type: basic}]}
  - {<<: *unary, id: conjugate, cpp: {name: SymEngine::conjugate, header: symengine/functions.h}}
  - {<<: *unary, id: loggamma, cpp: {name: SymEngine::loggamma, header: symengine/functions.h}}
  - {<<: *binary, id: polygamma, cpp: {name: SymEngine::polygamma, header: symengine/functions.h}, arguments: [{name: n, type: basic}, {name: x, type: basic}]}
  - {<<: *unary, id: digamma, cpp: {name: SymEngine::digamma, header: symengine/functions.h}}
  - {<<: *unary, id: trigamma, cpp: {name: SymEngine::trigamma, header: symengine/functions.h}}
  - {<<: *binary, id: uppergamma, cpp: {name: SymEngine::uppergamma, header: symengine/functions.h}, arguments: [{name: s, type: basic}, {name: x, type: basic}]}
  - {<<: *binary, id: lowergamma, cpp: {name: SymEngine::lowergamma, header: symengine/functions.h}, arguments: [{name: s, type: basic}, {name: x, type: basic}]}
  # Relational constructors.  These build a symbolic ``Boolean`` expression
  # ("x < 2", "True"), they do not decide structural equality, so the returned
  # object is an ordinary expression handle in every wrapper -- exactly what
  # nanobind hands Python.  ``symengine_eq()`` is PHP's pre-existing structural
  # predicate returning bool, and PHP function names are case-insensitive (so
  # ``symengine_Eq`` is not a distinct name); hence the one name override.
  - &boolean
    id: eq
    cpp: {name: SymEngine::Eq, header: symengine/logic.h}
    arguments: [{name: a, type: basic}, {name: b, type: basic}]
    returns: boolean
    behavior: binary_boolean
    expose: [python, perl, php, swift, java]
    implementation: generated
    names: {python: Eq, php: symengine_eq_relational}
  - {<<: *boolean, id: ne, cpp: {name: SymEngine::Ne, header: symengine/logic.h}, names: {python: Ne}}
  - {<<: *boolean, id: ge, cpp: {name: SymEngine::Ge, header: symengine/logic.h}, names: {python: Ge}}
  - {<<: *boolean, id: gt, cpp: {name: SymEngine::Gt, header: symengine/logic.h}, names: {python: Gt}}
  - {<<: *boolean, id: le, cpp: {name: SymEngine::Le, header: symengine/logic.h}, names: {python: Le}}
  - {<<: *boolean, id: lt, cpp: {name: SymEngine::Lt, header: symengine/logic.h}, names: {python: Lt}}

  # Number-theory entries taking ``Integer`` rather than ``Basic``.  nanobind
  # downcasts these from its own type system; the four type-erased wrappers get
  # a generated ``is_a<Integer>`` guard plus ``rcp_static_cast`` (see
  # ``render_common.cpp_call``) which reports a wrong argument type the
  # language's own way.  ``adapter.deref`` picks the SymEngine overload:
  # ``const Integer &`` (true) or ``const RCP<const Integer> &`` (false).
  - &integer_unary
    id: nextprime
    cpp: {name: SymEngine::nextprime, header: symengine/ntheory.h}
    arguments: [{name: a, type: integer}]
    returns: basic
    behavior: integer_unary
    expose: [python, perl, php, swift, java]
    implementation: generated
    adapter: {deref: true}
  - {<<: *integer_unary, id: totient, cpp: {name: SymEngine::totient, header: symengine/ntheory.h}, adapter: {deref: false}}
  - {<<: *integer_unary, id: carmichael, cpp: {name: SymEngine::carmichael, header: symengine/ntheory.h}, adapter: {deref: false}}
  - &integer_binary
    id: gcd
    cpp: {name: SymEngine::gcd, header: symengine/ntheory.h}
    arguments: [{name: a, type: integer}, {name: b, type: integer}]
    returns: basic
    behavior: integer_binary
    expose: [python, perl, php, swift, java]
    implementation: generated
    adapter: {deref: true}
  - {<<: *integer_binary, id: lcm, cpp: {name: SymEngine::lcm, header: symengine/ntheory.h}}
  - &status_integer
    id: mod_inverse
    cpp: {name: SymEngine::mod_inverse, header: symengine/ntheory.h}
    arguments: [{name: a, type: integer}, {name: m, type: integer}]
    returns: basic
    behavior: status_optional_unary
    expose: [python]
    implementation: generated
    adapter: {deref: true, status_type: int}
  - {<<: *status_integer, id: primitive_root, cpp: {name: SymEngine::primitive_root, header: symengine/ntheory.h}, arguments: [{name: n, type: integer}], adapter: {deref: true, status_type: bool}}
  - {<<: *status_integer, id: multiplicative_order, cpp: {name: SymEngine::multiplicative_order, header: symengine/ntheory.h}, arguments: [{name: a, type: integer}, {name: n, type: integer}], adapter: {deref: false, status_type: bool}}
  - {<<: *status_integer, id: nthroot_mod, cpp: {name: SymEngine::nthroot_mod, header: symengine/ntheory.h}, arguments: [{name: a, type: integer}, {name: n, type: integer}, {name: m, type: integer}], adapter: {deref: false, status_type: bool}}
  - {<<: *status_integer, id: powermod, cpp: {name: SymEngine::powermod, header: symengine/ntheory.h}, arguments: [{name: a, type: integer}, {name: b, type: number}, {name: m, type: integer}], adapter: {deref: false, status_type: bool}}
  - {<<: *status_integer, id: factor, cpp: {name: SymEngine::factor, header: symengine/ntheory.h}, arguments: [{name: n, type: integer}, {name: B1, type: double, default: 1.0}]}
  - {<<: *status_integer, id: factor_trial_division, cpp: {name: SymEngine::factor_trial_division, header: symengine/ntheory.h}, arguments: [{name: n, type: integer}]}
  - {<<: *status_integer, id: factor_lehman_method, cpp: {name: SymEngine::factor_lehman_method, header: symengine/ntheory.h}, arguments: [{name: n, type: integer}]}
  - {<<: *status_integer, id: factor_pollard_pm1_method, cpp: {name: SymEngine::factor_pollard_pm1_method, header: symengine/ntheory.h}, arguments: [{name: n, type: integer}, {name: B, type: unsigned, default: 10u}, {name: retries, type: unsigned, default: 5u}]}
  - {<<: *status_integer, id: factor_pollard_rho_method, cpp: {name: SymEngine::factor_pollard_rho_method, header: symengine/ntheory.h}, arguments: [{name: n, type: integer}, {name: retries, type: unsigned, default: 5u}]}
  - &integer_list
    id: prime_factors
    cpp: {name: SymEngine::prime_factors, header: symengine/ntheory.h}
    arguments: [{name: n, type: integer}]
    returns: basic
    behavior: list_integer_to_basic
    expose: [python]
    implementation: generated
    adapter: {deref: true}
  - {<<: *integer_list, id: primitive_root_list, cpp: {name: SymEngine::primitive_root_list, header: symengine/ntheory.h}}
  - {<<: *integer_list, id: nthroot_mod_list, cpp: {name: SymEngine::nthroot_mod_list, header: symengine/ntheory.h}, arguments: [{name: a, type: integer}, {name: n, type: integer}, {name: m, type: integer}], adapter: {deref: false}}
  - {<<: *integer_list, id: powermod_list, cpp: {name: SymEngine::powermod_list, header: symengine/ntheory.h}, arguments: [{name: a, type: integer}, {name: b, type: number}, {name: m, type: integer}], adapter: {deref: false}}
